# ============================================
# Mosquitto MQTT Broker Configuration
# Smart Home Project
# ============================================

# === LISTENERS ===
# MQTT протокол
listener 1883 0.0.0.0
protocol mqtt

# WebSocket поддержка (для браузеров)
listener 9001 0.0.0.0
protocol websockets

# === БЕЗОПАСНОСТЬ ===
# Запрещаем анонимный доступ
allow_anonymous false

# Файлы паролей и ACL
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# === ПЕРСИСТЕНТНОСТЬ ===
# Сохранять состояние между перезапусками
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800
persistent_client_expiration 1d

# === ЛОГИРОВАНИЕ ===
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type all
log_timestamp true
connection_messages true

# === НАСТРОЙКИ СОЕДИНЕНИЙ ===
max_connections 1000
max_inflight_messages 100
max_queued_messages 1000

# === НАСТРОЙКИ СООБЩЕНИЙ ===
message_size_limit 1048576  # 1MB
retain_available true

# === ТАЙМАУТЫ ===
keepalive_interval 60
client_expiration 7 days

# === НАСТРОЙКИ SSL (опционально) ===
# listener 8883 0.0.0.0
# protocol mqtt
# cafile /mosquitto/ssl/ca.crt
# certfile /mosquitto/ssl/server.crt
# keyfile /mosquitto/ssl/server.key
# require_certificate false

# === ДОПОЛНИТЕЛЬНО ===
sys_interval 10