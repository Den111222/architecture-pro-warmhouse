# ===== ОСНОВНЫЕ НАСТРОЙКИ =====
pid_file /mosquitto/data/mosquitto.pid
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# ===== СЛУШАТЕЛЬ ДЛЯ MQTT =====
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# ===== СЛУШАТЕЛЬ ДЛЯ WEBSOCKETS (порт 9001 внутри контейнера) =====
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
# Для веб-сокетов можно указать отдельный путь
# http_dir /mosquitto/www

# ===== НАСТРОЙКИ ПАКЕТОВ =====
# Заменяем устаревшую message_size_limit на max_packet_size
max_packet_size 1048576

# ===== НАСТРОЙКИ КЛИЕНТОВ =====
max_connections 1000

# ===== БЕЗОПАСНОСТЬ (если нужна аутентификация) =====
# Раскомментируйте для включения паролей:
# password_file /mosquitto/config/passwd
# allow_anonymous false

# ===== BRIDGE НАСТРОЙКИ (ЕСЛИ НУЖНЫ) =====
# Если не используете bridge connection, НЕ добавляйте keepalive_interval
# Пример bridge конфигурации (закомментировано):
# connection bridge-to-cloud
# address mqtt.cloud.broker.com:1883
# topic # both
# keepalive_interval 60
# remote_username user
# remote_password pass